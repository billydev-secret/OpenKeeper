name: Set up Python deps
description: >
  Set up the pinned Python version and install from the compiled lockfile so
  CI tests the exact pinned set prod will install. Shared by every job that
  needs the dev environment (lint, typecheck, test, browser) so the install
  step can't drift between them. Callers must `actions/checkout` first — a
  local `uses: ./...` action needs the repo already checked out.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: requirements/dev.lock

    # Install from the compiled lockfile so CI tests the exact pinned set
    # prod will install; Dependabot bumps these pins in weekly PRs.
    - name: Install dependencies
      shell: bash
      run: |
        pip install -r requirements/dev.lock
