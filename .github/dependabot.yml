version: 2
updates:
  # Bumps the pins in requirements/*.lock (pip-compile-compatible files).
  # All updates land as one weekly grouped PR; the Test Suite workflow runs
  # the full gate against it, so a green PR = the new versions are tested.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # Bumps the pins in package-lock.json — the eslint/stylelint toolchain the
  # blocking js-lint job runs. Grouped like the Python deps so the three dev
  # tools arrive as one weekly PR rather than three.
  #
  # Expect the first PR to offer eslint 9, which is a major: v9 moved to flat
  # config (eslint.config.js) and drops package.json's eslintConfig. That is a
  # real migration, not a version bump, so review it as one.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      js-deps:
        patterns: ["*"]
